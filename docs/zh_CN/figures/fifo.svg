<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 340" role="img"><title>一个满 chunk 内的 Simple 协议推进</title><desc>以 4 MiB Simple 缓冲、FP32、起始 step=0 的 FIFO 路径为例；两轮占完八个槽后可循环利用。</desc><rect width="100%" height="100%" fill="#f7fafc"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" fill="#132f43"><text x="18" y="31" font-size="22" font-weight="700">一个满 chunk 内的 Simple 协议推进</text><text x="18" y="57" font-size="14" font-weight="400">以 4 MiB Simple 缓冲、FP32、起始 step=0 的 FIFO 路径为例；两轮占完八个槽后可循环利用。</text><text x="186.0" y="90" font-size="15" font-weight="700">第一个 slice</text><text x="508.5" y="90" font-size="15" font-weight="700">第二个 slice</text><text x="18" y="130" font-size="15" font-weight="700">chunk A · FIFO 槽</text><rect x="180.0" y="104" rx="5" width="316.5" height="39" fill="#c5e6e0"/><text x="188.0" y="129" font-size="14" font-weight="400">0、1</text><rect x="502.5" y="104" rx="5" width="316.5" height="39" fill="#f8dbad"/><text x="510.5" y="129" font-size="14" font-weight="400">2、3</text><text x="18" y="184" font-size="15" font-weight="700">chunk A · 元素数</text><rect x="180.0" y="158" rx="5" width="316.5" height="39" fill="#c5e6e0"/><text x="188.0" y="183" font-size="14" font-weight="400">262,144</text><rect x="502.5" y="158" rx="5" width="316.5" height="39" fill="#f8dbad"/><text x="510.5" y="183" font-size="14" font-weight="400">262,144</text><text x="18" y="238" font-size="15" font-weight="700">chunk B · FIFO 槽</text><rect x="180.0" y="212" rx="5" width="316.5" height="39" fill="#c5e6e0"/><text x="188.0" y="237" font-size="14" font-weight="400">4、5</text><rect x="502.5" y="212" rx="5" width="316.5" height="39" fill="#f8dbad"/><text x="510.5" y="237" font-size="14" font-weight="400">6、7</text><text x="18" y="292" font-size="15" font-weight="700">chunk C · 绝对 step</text><rect x="180.0" y="266" rx="5" width="316.5" height="39" fill="#c5e6e0"/><text x="188.0" y="291" font-size="14" font-weight="400">8 → 槽 0</text><rect x="502.5" y="266" rx="5" width="316.5" height="39" fill="#f8dbad"/><text x="510.5" y="291" font-size="14" font-weight="400">10 → 槽 2</text></g></svg>