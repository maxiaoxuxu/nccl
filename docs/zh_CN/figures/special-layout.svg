<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 263" role="img" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif"><title>CollNetDirect 的同一圈，六个四元素块怎样排列？</title><desc>每格宽度均为 4 个元素。c 表示相对 channel 编号，h 表示 headRank。</desc><rect x="0" y="0" width="880" height="263" rx="12" fill="#f5f8fa" stroke="none" /><text x="25" y="38" fill="#172b40" font-size="25" font-weight="650">CollNetDirect 的同一圈，六个四元素块怎样排列？</text><text x="25" y="66" fill="#435d70" font-size="15" font-weight="400">每格宽度均为 4 个元素。c 表示相对 channel 编号，h 表示 headRank。</text><text x="25" y="122" fill="#172b40" font-size="15" font-weight="650">netRegUsed=0</text><rect x="170" y="99" width="105" height="54" rx="9" fill="#dceef0" stroke="none" /><text x="182" y="122" fill="#156385" font-size="17" font-weight="650">c0 / h0</text><text x="182" y="143" fill="#435d70" font-size="14" font-weight="400">[0, 4)</text><rect x="284" y="99" width="105" height="54" rx="9" fill="#dceef0" stroke="none" /><text x="296" y="122" fill="#156385" font-size="17" font-weight="650">c0 / h1</text><text x="296" y="143" fill="#435d70" font-size="14" font-weight="400">[4, 8)</text><rect x="398" y="99" width="105" height="54" rx="9" fill="#dceef0" stroke="none" /><text x="410" y="122" fill="#156385" font-size="17" font-weight="650">c0 / h2</text><text x="410" y="143" fill="#435d70" font-size="14" font-weight="400">[8, 12)</text><rect x="512" y="99" width="105" height="54" rx="9" fill="#f6e8d9" stroke="none" /><text x="524" y="122" fill="#9c5415" font-size="17" font-weight="650">c1 / h0</text><text x="524" y="143" fill="#435d70" font-size="14" font-weight="400">[12, 16)</text><rect x="626" y="99" width="105" height="54" rx="9" fill="#f6e8d9" stroke="none" /><text x="638" y="122" fill="#9c5415" font-size="17" font-weight="650">c1 / h1</text><text x="638" y="143" fill="#435d70" font-size="14" font-weight="400">[16, 20)</text><rect x="740" y="99" width="105" height="54" rx="9" fill="#f6e8d9" stroke="none" /><text x="752" y="122" fill="#9c