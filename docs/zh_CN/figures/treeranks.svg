  <rect x="610" y="185" width="150" height="46" rx="9" fill="#e6eff8" stroke="#7b999f" />
  <text x="685" y="215" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="600" fill="#19344a" text-anchor="middle">内部  ·  rank 1</text>
  <rect x="511" y="273" width="150" height="46" rx="9" fill="#f4f5f1" stroke="#7b999f" />
