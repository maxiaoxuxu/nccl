  <text x="235" y="215" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="600" fill="#19344a" text-anchor="middle">内部  ·  rank 2</text>
  <rect x="61" y="273" width="150" height="46" rx="9" fill="#f4f5f1" stroke="#7b999f" />
  <text x="136" y="303" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="600" fill="#19344a" text-anchor="middle">叶  ·  rank 1</text>
  <rect x="259" y="273" width="150" height="46" rx="9" fill="#f4f5f1" stroke="#7b999f" />
  <text x="334" y="303" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="600" fill="#19344a" text-anchor="middle">叶  ·  rank 3</text>
  <text x="235" y="354" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#19344a" text-anchor="middle">16 块，每块 131,072 个 FP32</text>
  <rect x="476" y="18" width="418" height="362" rx="13" fill="#ffffff" stroke="#bfd0ce" stroke-width="1.6" />
  <text x="685" y="52" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="700" fill="#164f4b" text-anchor="middle">channel 1</text>
  <text x="685" y="80" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#19344a" text-anchor="middle">元素 [2,097,152, 4,194,303)</text>
  <line x1="685" y1="150" x2="685" y2="185" stroke="#587c7a" stroke-width="3" />
  <line x1="685" y1="230" x2="586" y2="273" stroke="#587c7a" stroke-width="3" />
