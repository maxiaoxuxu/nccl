  <text x="460" y="419" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="500" fill="#19344a" text-anchor="middle">沿连线向上归约，向下广播。同一棵树的每一跳使用相同的元素下标。</text>
</svg>