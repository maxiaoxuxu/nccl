<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 450" role="img" aria-labelledby="title desc">
  <title id="title">四个节点、两个通道的 Tree AllReduce</title>
  <desc id="desc">左侧根 0 通过内部节点 2 连接叶子 1、3。右侧根 3 通过内部节点 1 连接叶子 2、0。每条线沿上行归约、下行广播。</desc>
  <rect x="0" y="0" width="920" height="450" rx="16" fill="#fafcfb" />
  <rect x="26" y="18" width="418" height="362" rx="13" fill="#ffffff" stroke="#bfd0ce" stroke-width="1.6" />
  <text x="235" y="52" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="700" fill="#164f4b" text-anchor="middle">channel 0</text>
  <text x="235" y="80" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#19344a" text-anchor="middle">元素 [0, 2,097,152)</text>
  <line x1="235" y1="150" x2="235" y2="185" stroke="#587c7a" stroke-width="3" />
  <line x1="235" y1="230" x2="136" y2="273" stroke="#587c7a" stroke-width="3" />
  <line x1="235" y1="230" x2="334" y2="273" stroke="#587c7a" stroke-width="3" />
  <rect x="160" y="105" width="150" height="46" rx="9" fill="#d8eeea" stroke="#7b999f" />
  <text x="235" y="135" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="600" fill="#19344a" text-anchor="middle">根  ·  rank 0</text>
