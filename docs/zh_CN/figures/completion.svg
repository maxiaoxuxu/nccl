<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 325" role="img" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif"><title>谁能确认一个接收槽已经可以复用？</title><desc>从左向右读。下方两条路径说明网络接收完成与 GPU 消费确认之间的条件。</desc><rect x="0" y="0" width="880" height="325" rx="12" fill="#f5f8fa" stroke="none" /><text x="25" y="38" fill="#172b40" font-size="25" font-weight="650">谁能确认一个接收槽已经可以复用？</text><text x="25" y="66" fill="#435d70" font-size="15" font-weight="400">从左向右读。下方两条路径说明网络接收完成与 GPU 消费确认之间的条件。</text><rect x="25" y="90" width="186" height="66" rx="9" fill="#dfedf0" stroke="none" /><text x="37" y="119" fill="#156385" font-size="20" font-weight="650">posted</text><text x="37" y="144" fill="#172b40" font-size="15" font-weight="400">irecv 已给出请求</text><text x="215" y="134" fill="#435d70" font-size="19" font-weight="400">→</text><rect x="239" y="90" width="186" height="66" rx="9" fill="#dfedf0" stroke="none" /><text x="251" y="119" fill="#156385" font-size="20" font-weight="650">received</text><text x="251" y="144" fill="#172b40" font-size="15" font-weight="400">网络 test 完成</text><text x="429" y="134" fill="#435d70" font-size="19" font-weight="400">→</text><rect x="453" y="90" width="186" height="66" rx="9" fill="#dfedf0" stroke="none" /><text x="465" y="119" fill="#156385" font-size="20" font-weight="650">transmitted</text><text x="465" y="144" fill="#172b40" font-size="15" font-weight="400">tail 已发布</text><text x="643" y="134" fill="#435d70" font-size="19" font-weight="400">→</text><rect x="667" y="90" width="186" height="66" rx="9" fill="#dfedf0" stroke="none" /><text x="679" y="119" fill="#156385" font-size="20" font-weight="650">done</text><text x="679" y="144" fill="#172b40" font-size="15" font-weight="400">GPU head 已推进</text><rect x="27" y="182" width="825" height="54" rx="9" fill="#e7f2eb" stroke="none" /><text x="43" y="205" fill="#087269" font-size="17" font-weight="650">收到非空 Simple 数据，且 GDR 要求 flush</text><text x="43" y="226" fill="#172b40" font-size="15" font-weight="400">gdcFlush 读回，或调用插件 iflush 并等待其完成，然后发布 tail。</text><rect x="27" y="246" width="825" height="54" rx="9" fill="#e7edf4" stroke="none" /><text x="43" y="268" fill="#156385" font-size="17" font-weight="650">GPU 消费确认</text><text x="43" y="290" fill="#172b40" font-size="15" font-weight="400">读 sendMem-&gt;head；若插件提供 irecvConsumed，则通知插件，再推进 done。</text></svg>
